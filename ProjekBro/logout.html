<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toko Online - Admin Panel (Log Out)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col md:grid md:grid-cols-[240px_1fr]">

  <aside class="bg-[#10172a] text-slate-400 p-4 md:p-6 flex flex-col gap-2">
    <div class="flex items-center justify-between md:block">
      <div>
        <div class="text-white text-lg md:text-xl font-bold">Toko Online</div>
        <div class="text-xs text-slate-500">Admin Panel</div>
      </div>
    </div>

    <hr class="my-3 md:my-4 border-gray-700">
    <div class="text-xs font-semibold text-slate-500 tracking-wider uppercase mb-1">MENU UTAMA</div>
    
    <nav class="flex md:flex-col gap-1 text-sm font-medium overflow-x-auto pb-2 md:pb-0">
      <a href="dashboard.html" class="flex items-center gap-2 px-3 md:px-4 py-2.5 md:py-3 rounded-xl hover:bg-slate-800 whitespace-nowrap">🏠 Dashboard</a>
      <a href="produk.html" class="flex items-center gap-2 px-3 md:px-4 py-2.5 md:py-3 rounded-xl hover:bg-slate-800 whitespace-nowrap">📦 Produk</a>
      <a href="pesanan.html" class="flex items-center gap-2 px-3 md:px-4 py-2.5 md:py-3 rounded-xl hover:bg-slate-800 whitespace-nowrap">🛒 Pesanan</a>
      <a href="pelanggan.html" class="flex items-center gap-2 px-3 md:px-4 py-2.5 md:py-3 rounded-xl hover:bg-slate-800 whitespace-nowrap">👥 Pelanggan</a>
      <a href="pengaturan.html" class="flex items-center gap-2 px-3 md:px-4 py-2.5 md:py-3 rounded-xl hover:bg-slate-800 whitespace-nowrap">⚙️ Pengaturan</a>
      <a href="logout.html" class="flex items-center gap-2 px-3 md:px-4 py-2.5 md:py-3 rounded-xl bg-rose-600 text-white shadow-lg shadow-rose-600/30 whitespace-nowrap md:mt-2">🚪 Log Out</a>
    </nav>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    
    <header class="bg-white px-4 md:px-8 py-4 md:py-5 border-b border-slate-200 flex justify-between items-center">
      <div>
        <h1 class="text-lg md:text-xl font-bold text-slate-900">Log Out</h1>
        <p class="text-xs text-slate-500">Keluar dari akun administrator</p>
      </div>
      
      <div class="flex items-center gap-4">

        <button class="relative p-2 text-gray-600 hover:bg-slate-100 rounded-full transition cursor-pointer">
          <span class="text-xl">🔔</span>
          <span class="absolute -top-0.5 -right-0.5 bg-rose-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center border-2 border-white">3</span>
        </button>

        <div class="flex items-center gap-3">
          <div class="text-right hidden sm:block">
            <div class="text-sm font-semibold text-slate-900 leading-none">Admin</div>
            <div class="text-xs text-slate-500 mt-0.5">Administrator</div>
          </div>
          <div class="w-8 h-8 md:w-9 md:h-9 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-sm">A</div>
        </div>
      </div>
    </header>

    <main class="p-4 md:p-8 flex items-center justify-center min-h-[75vh]">
      
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 md:p-8 max-w-md w-full text-center space-y-5">
        <div class="w-16 h-16 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto text-3xl">
          🚪
        </div>
        
        <div>
          <h2 class="text-lg md:text-xl font-bold text-slate-900">Konfirmasi Keluar</h2>
          <p class="text-xs md:text-sm text-slate-500 mt-1">Apakah Anda yakin ingin keluar dari halaman admin?</p>
        </div>

        <div class="bg-slate-50 border border-slate-100 p-3.5 rounded-lg text-left text-xs text-slate-600 space-y-1.5">
          <div class="flex justify-between">
            <span>Akun:</span>
            <span class="font-semibold text-slate-800">Admin</span>
          </div>
          <div class="flex justify-between">
            <span>Role:</span>
            <span class="font-semibold text-slate-800">Administrator</span>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-2.5 pt-2">
          <button onclick="history.back()" class="w-full py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm rounded-lg transition cursor-pointer">
            Batal
          </button>
          <button class="w-full py-2.5 px-4 bg-rose-600 hover:bg-rose-700 text-white font-medium text-sm rounded-lg transition shadow-md shadow-rose-600/20 cursor-pointer">
            Keluar
          </button>
        </div>
      </div>

    </main>
  </div>

</body>
</html>
